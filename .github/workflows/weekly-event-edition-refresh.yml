name: Weekly event edition refresh

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run edition refresh audit
        run: node scripts/refresh-event-editions.mjs

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: event-edition-refresh
          path: audit/

      - name: Create or update audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Weekly event edition refresh";
            const body = fs.readFileSync("audit/event-edition-refresh.md", "utf8");
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "event-audit",
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["event-audit"] });
            }
