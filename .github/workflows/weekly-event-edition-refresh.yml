name: Weekly event edition refresh

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run edition refresh audit
        run: node scripts/refresh-event-editions.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run data quality report
        run: node scripts/data-quality-report.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: event-edition-refresh
          path: audit/

      - name: Create or update audit issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            async function upsertIssue(title, bodyPath, labels) {
              const body = fs.readFileSync(bodyPath, "utf8");
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: "open",
                labels: labels[0],
                per_page: 100
              });
              const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels });
              }
            }

            await ensureLabel("event-audit", "ededed", "Automated event source audit");
            await ensureLabel("next-edition", "bfd4f2", "Missing future edition candidates");
            await ensureLabel("event-refresh", "d4f2bf", "Upcoming event detail refresh");
            await ensureLabel("near-term-refresh", "f2d4bf", "30-day event detail verification");

            await upsertIssue(
              "Weekly next-edition discovery",
              "audit/event-edition-refresh.md",
              ["event-audit", "next-edition"]
            );
            await upsertIssue(
              "Upcoming event refresh",
              "audit/upcoming-event-refresh.md",
              ["event-refresh"]
            );
            await upsertIssue(
              "30-day event detail check",
              "audit/near-term-event-detail-check.md",
              ["event-refresh", "near-term-refresh"]
            );
